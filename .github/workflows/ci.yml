name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      proving_keys:
        description: "Generate ZK proving keys and a real proof via the Midnight proof server (network downloads; slow)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  web:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run contract:demo
      - run: npm run build

  contract:
    name: Compile Compact contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Compact toolchain 0.31.1
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: "0.31.1"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Confirm pinned compiler
        run: test "$(compact compile --version)" = "0.31.1"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Compile (circuit logic + ZKIR, no proving keys)
        run: node scripts/compile-contract.mjs
      - name: Committed compiled output matches the source
        run: git diff --exit-code -- contract/src/managed

  zk-proof:
    name: Proving keys + real ZK proof
    if: github.event_name == 'workflow_dispatch' && inputs.proving_keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: "0.31.1"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Full compile (proving keys)
        run: npm run contract:compile:full
      - name: Record key material
        run: |
          ls -la contract/build/closed-book/keys contract/build/closed-book/zkir
          sha256sum contract/build/closed-book/keys/* contract/build/closed-book/zkir/*
          grep -m1 -o "avx2" /proc/cpuinfo || echo "no avx2"
      - name: Start Midnight proof server 8.1.0
        run: |
          docker run -d --name proof-server -p 6300:6300 midnightntwrk/proof-server:8.1.0
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:6300/ready && break; sleep 5; done
          curl -sf http://127.0.0.1:6300/version
      - name: Real proof (6/6) and refused proof (5/6)
        run: npm run proof:demo -- --server http://127.0.0.1:6300
      - name: Proof server log
        if: always()
        run: docker logs proof-server 2>&1 | tail -50
      - uses: actions/upload-artifact@v4
        with:
          name: closed-book-proving-keys
          path: |
            contract/build/closed-book/keys
            contract/build/closed-book/zkir
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: closed-book-proof-evidence
          path: proofs
          retention-days: 90
